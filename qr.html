<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air-Gap QR Transfer</title>
<style>
  :root {
    --bg: #f6f5f1;
    --fg: #1a1a1a;
    --muted: #6a6a6a;
    --accent: #c8412f;
    --border: #d8d6cf;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 24px 0; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 14px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  header h1 .accent { color: var(--accent); }
  nav { display: flex; gap: 0; }
  nav button { background: none; border: none; padding: 10px 18px 12px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
  nav button.active { color: var(--fg); border-bottom-color: var(--accent); }
  main { flex: 1; padding: 22px 24px; max-width: 720px; width: 100%; margin: 0 auto; }
  section { display: flex; flex-direction: column; gap: 14px; }
  section[hidden] { display: none; }
  textarea { width: 100%; padding: 12px; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; resize: vertical; min-height: 110px; color: var(--fg); }
  textarea:focus { outline: none; border-color: var(--accent); }
  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .controls input, .controls select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); }
  .controls .val { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.primary, button.secondary { padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  button.primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
  button.primary:hover { filter: brightness(0.95); }
  button.primary:disabled { background: #999; border-color: #999; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--bg); }
  .qr-area { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 320px; }
  .qr-area canvas, .qr-area img { display: block; image-rendering: pixelated; image-rendering: -moz-crisp-edges; max-width: 100%; }
  .status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 4px 2px; }
  .status .key { color: var(--fg); font-weight: 500; }
  .status .ok { color: #2a7d3a; }
  .video-wrap { background: black; border-radius: 6px; overflow: hidden; aspect-ratio: 4/3; position: relative; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--accent); transition: width 0.2s; }
  .chunk-grid { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; max-height: 80px; overflow-y: auto; }
  .chunk-cell { width: 12px; height: 12px; background: var(--border); border-radius: 2px; }
  .chunk-cell.got { background: var(--accent); }
  .help { font-size: 12px; color: var(--muted); padding: 8px 0; line-height: 1.5; }
  .mode-bar { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  .mode-opt { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: var(--fg); }
  .mode-opt input[type=radio] { margin: 0; accent-color: var(--accent); }
  .mode-opt b { color: var(--accent); }
  .file-drop-label { display: flex; align-items: center; justify-content: center; min-height: 80px; border: 2px dashed var(--border); border-radius: 6px; cursor: pointer; background: var(--panel); font-size: 14px; color: var(--muted); transition: border-color .15s, background .15s; }
  .file-drop-label:hover { border-color: var(--accent); background: var(--bg); }
  .file-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; padding: 4px 0; }
  .file-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
  .file-item .file-name { color: var(--fg); font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
  .file-item .file-size { color: var(--muted); flex-shrink: 0; margin-left: 8px; }
  .file-item a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .file-item a:hover { text-decoration: underline; }
  .paste-block { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; }
  .paste-block summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--fg); padding: 2px 0; user-select: none; }
  .paste-block summary:hover { color: var(--accent); }
  .paste-block[open] summary { margin-bottom: 10px; }
  .paste-help { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .paste-help code { background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
  #pasteFrames { min-height: 80px; font-size: 12px; margin-bottom: 8px; }
  #pasteStatus { padding-left: 4px; }
  @media (max-width: 600px) {
    .controls { grid-template-columns: 1fr 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Air QR<span class="accent">●</span></h1>
  <nav>
    <button id="tabSend" class="active">Send</button>
    <button id="tabReceive">Receive</button>
  </nav>
</header>

<main>
  <section id="sendPanel">
    <div class="mode-bar" id="sourceBar">
      <label class="mode-opt"><input type="radio" name="source" value="text" checked> <b>Text</b> &mdash; paste here</label>
      <label class="mode-opt"><input type="radio" name="source" value="files"> <b>TText</b> &mdash; select here</label>
    </div>
    <textarea id="textInput" placeholder="Paste text to transfer..."></textarea>
    <div id="fileInputSection" hidden>
      <label class="file-drop-label" id="fileDropLabel" for="fileInput">
        <span id="fileDropText">&#128193; Click to choose Ttext</span>
        <input type="file" id="fileInput" multiple webkitdirectory accept="*/*" style="display:none">
      </label>
      <div id="fileList" class="file-list"></div>
    </div>
    <div class="mode-bar">
      <label class="mode-opt"><input type="radio" name="mode" value="bulk" checked> <b>Bulk</b> &mdash; one big QR at a time, compressed (recommended)</label>
      <label class="mode-opt"><input type="radio" name="mode" value="animated"> Animated &mdash; loop through small QRs (legacy)</label>
    </div>
    <div class="controls" id="bulkControls">
      <label>Target size per QR <span class="val" id="bulkSizeVal">1500</span> B
        <input type="range" id="bulkSize" min="500" max="2800" value="1500" step="100">
      </label>
      <label>ECC level
        <select id="bulkEcc">
          <option value="L" selected>L (7% &mdash; densest)</option>
          <option value="M">M (15%)</option>
          <option value="Q">Q (25%)</option>
          <option value="H">H (30% &mdash; most robust)</option>
        </select>
      </label>
      <label>Compression
        <select id="bulkCompress">
          <option value="deflate" selected>deflate (best for text)</option>
          <option value="none">none (raw text)</option>
        </select>
      </label>
    </div>
    <div class="controls" id="animatedControls" hidden>
      <label>Chunk size <span class="val" id="chunkVal">400</span> B
        <input type="range" id="chunkSize" min="80" max="900" value="400" step="20">
      </label>
      <label>FPS <span class="val" id="fpsVal">5</span>
        <input type="range" id="fps" min="1" max="15" value="5">
      </label>
      <label>ECC level
        <select id="ecc">
          <option value="L" selected>L (7% &mdash; densest)</option>
          <option value="M">M (15%)</option>
          <option value="Q">Q (25%)</option>
          <option value="H">H (30% &mdash; most robust)</option>
        </select>
      </label>
    </div>
    <div class="btn-row" id="bulkButtons">
      <button class="primary" id="bulkPrepare">Prepare bulk QRs</button>
      <button class="secondary" id="bulkClear" disabled>Clear</button>
    </div>
    <div class="btn-row" id="animatedButtons" hidden>
      <button class="primary" id="startSend">Start broadcasting</button>
      <button class="secondary" id="pauseSend" disabled>Pause</button>
      <button class="secondary" id="stopSend" disabled>Stop</button>
    </div>
    <div class="btn-row" id="manualNav" hidden>
      <button class="secondary" id="prevFrame" title="Left arrow">&#9664; Prev</button>
      <button class="secondary" id="nextFrame" title="Right arrow">Next &#9654;</button>
      <input type="number" id="jumpFrame" min="1" placeholder="Frame #" style="width:90px; padding:6px 8px; border:1px solid var(--border); border-radius:4px; font: inherit; font-size:13px;">
      <button class="secondary" id="goFrame">Go to frame</button>
    </div>
    <div class="btn-row" id="bulkNav" hidden>
      <button class="secondary" id="bulkPrev" title="Left arrow">&#9664; Prev</button>
      <button class="secondary" id="bulkNext" title="Right arrow">Next &#9654;</button>
      <input type="number" id="bulkJump" min="1" placeholder="Frame #" style="width:90px; padding:6px 8px; border:1px solid var(--border); border-radius:4px; font: inherit; font-size:13px;">
      <button class="secondary" id="bulkGo">Go to frame</button>
    </div>
    <div class="qr-area"><div id="qrCanvas"></div></div>
    <div class="status" id="sendStatus">Ready. Paste text and click Start.</div>
  </section>

  <section id="receivePanel" hidden>
    <div class="btn-row">
      <button class="primary" id="startScan">Start</button>
      <button class="secondary" id="stopScan" disabled>Stop</button>
      <button class="secondary" id="resetScan">Reset</button>
    </div>
    <div class="video-wrap"><video id="video" playsinline muted></video></div>
    <canvas id="scanCanvas" hidden></canvas>
    <div class="status" id="recvStatus">Tap &ldquo;Start&rdquo; and point.</div>
    <div class="progress-bar"><div id="progBar" style="width:0%"></div></div>
    <div class="chunk-grid" id="chunkGrid"></div>
    <div class="status" id="missingList"></div>
    <details class="paste-block">
      <summary>Paste frames manually</summary>
      <textarea id="pasteFrames" placeholder="Q3|DABCD|1|8|...&#10;Q3|DABCD|2|8|...&#10;Q3|DABCD|3|8|..."></textarea>
      <div class="btn-row">
        <button class="primary" id="addFrames">Add frame(s)</button>
        <span class="status" id="pasteStatus"></span>
      </div>
    </details>
    <textarea id="output" readonly placeholder="Reconstructed text will appear here..."></textarea>
    <div id="fileOutput" hidden>
      <div class="status" id="fileStatus">Files received:</div>
      <div id="fileListRecv" class="file-list"></div>
      <div class="btn-row">
        <button class="secondary" id="downloadZip">&#128230; Download all as ZIP</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="secondary" id="copyOut">Copy to clipboard</button>
      <button class="secondary" id="downloadOut">Download as .txt</button>
    </div>
  </section>
</main>

<script>
"use strict";

// ============ Protocol ============
// Each QR frame contains a single ASCII line:
//   Q2|<session>|<index>|<total>|<payload>
// where:
//   session  = 4 base36 chars, identifies one broadcast
//   index    = 1-based frame number (matches what the UI displays everywhere)
//   total    = total frame count
//   payload  = raw text chunk (UTF-8 safe, includes any chars except newline)
// Receiver collects unique indices until it has all `total`.
// (v3 changed wire format from 0-indexed Q1 to 1-indexed Q2 so what you see is what's
//  inside the QR. Both formats accepted on receive for backward compatibility.)

const PROTOCOL = "Q2";

function makeSession() {
  return Math.random().toString(36).slice(2, 6).padEnd(4, "0").toUpperCase();
}

function chunkText(text, size) {
  // We split by bytes (UTF-8) so the actual binary fits in QR capacity.
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const bytes = enc.encode(text);
  const chunks = [];
  let i = 0;
  while (i < bytes.length) {
    let end = Math.min(i + size, bytes.length);
    // Avoid splitting a multi-byte UTF-8 character in the middle.
    while (end < bytes.length && (bytes[end] & 0xC0) === 0x80) end--;
    if (end <= i) end = i + size; // fallback
    chunks.push(dec.decode(bytes.slice(i, end)));
    i = end;
  }
  return chunks.length ? chunks : [""];
}

// ============ Tab switching ============
const tabSend = document.getElementById("tabSend");
const tabReceive = document.getElementById("tabReceive");
const sendPanel = document.getElementById("sendPanel");
const recvPanel = document.getElementById("receivePanel");

tabSend.onclick = () => {
  tabSend.classList.add("active"); tabReceive.classList.remove("active");
  sendPanel.hidden = false; recvPanel.hidden = true;
  stopScanning();
};
tabReceive.onclick = () => {
  tabReceive.classList.add("active"); tabSend.classList.remove("active");
  recvPanel.hidden = false; sendPanel.hidden = true;
  stopBroadcast();
};

// ============ SEND mode ============
const textInput = document.getElementById("textInput");
const chunkSize = document.getElementById("chunkSize");
const fps = document.getElementById("fps");
const eccSel = document.getElementById("ecc");
const chunkVal = document.getElementById("chunkVal");
const fpsVal = document.getElementById("fpsVal");
const startSend = document.getElementById("startSend");
const pauseSend = document.getElementById("pauseSend");
const stopSend = document.getElementById("stopSend");
const manualNav = document.getElementById("manualNav");
const prevFrame = document.getElementById("prevFrame");
const nextFrame = document.getElementById("nextFrame");
const jumpFrame = document.getElementById("jumpFrame");
const goFrame = document.getElementById("goFrame");
const qrCanvas = document.getElementById("qrCanvas");
const sendStatus = document.getElementById("sendStatus");

chunkSize.oninput = () => chunkVal.textContent = chunkSize.value;
fps.oninput = () => fpsVal.textContent = fps.value;

let broadcastTimer = null;
let broadcastFrames = [];
let broadcastIdx = 0;
let broadcastLoops = 0;
let broadcastSession = "";
let broadcastEcc = "L";
let broadcastPaused = false;

function renderFrame(text, ecc, large) {
  // Render to canvas with pixel-perfect (no anti-aliasing) cells.
  const qr = qrcode(0, ecc);
  qr.addData(text);
  qr.make();
  const moduleCount = qr.getModuleCount();
  const margin = 4;
  const totalModules = moduleCount + margin * 2;
  // Target a generous on-screen size so cells stay readable even at high versions.
  // For bulk mode (large=true) we aim larger; for animated we keep it more compact.
  const targetPx = large ? 1000 : 640;
  // Ensure a minimum cell size of 5 pixels so the phone camera can resolve cells
  // even at version 30-40. If the resulting QR exceeds the target, that's fine —
  // CSS max-width handles overflow.
  const cellSize = Math.max(5, Math.floor(targetPx / totalModules));
  const sizePx = totalModules * cellSize;

  let canvas = qrCanvas.querySelector("canvas");
  if (!canvas) {
    qrCanvas.innerHTML = "";
    canvas = document.createElement("canvas");
    canvas.style.imageRendering = "pixelated";
    canvas.style.maxWidth = "100%";
    canvas.style.height = "auto";
    qrCanvas.appendChild(canvas);
  }
  if (canvas.width !== sizePx) { canvas.width = sizePx; canvas.height = sizePx; }
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, sizePx, sizePx);
  ctx.fillStyle = "#000000";
  for (let r = 0; r < moduleCount; r++) {
    for (let c = 0; c < moduleCount; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect((margin + c) * cellSize, (margin + r) * cellSize, cellSize, cellSize);
      }
    }
  }
}

function showCurrentFrame() {
  if (!broadcastFrames.length) return;
  const total = broadcastFrames.length;
  if (broadcastIdx < 0) broadcastIdx = total - 1;
  if (broadcastIdx >= total) broadcastIdx = 0;
  const payload = broadcastFrames[broadcastIdx];
  // Wire format is now 1-indexed (Q2). What's in the QR matches what the UI shows.
  const frame = `${PROTOCOL}|${broadcastSession}|${broadcastIdx + 1}|${total}|${payload}`;
  try {
    renderFrame(frame, broadcastEcc, broadcastPaused);
    const state = broadcastPaused
      ? `<span style="color:var(--accent); font-weight:600">PAUSED</span> on frame <span class="key">${broadcastIdx + 1}/${total}</span>`
      : `Frame <span class="key">${broadcastIdx + 1}/${total}</span> &middot; loop <span class="key">${broadcastLoops + 1}</span>`;
    sendStatus.innerHTML = `${state} &middot; session <span class="key">${broadcastSession}</span> &middot; ${frame.length} chars/frame`;
  } catch (e) {
    sendStatus.innerHTML = `<span style="color:var(--accent)">Error: ${e.message}. Try a smaller chunk size.</span>`;
    stopBroadcast();
  }
}

function tickBroadcast() {
  if (broadcastIdx >= broadcastFrames.length) { broadcastIdx = 0; broadcastLoops++; }
  showCurrentFrame();
  broadcastIdx++;
}

function startBroadcast() {
  const text = textInput.value;
  if (!text) { sendStatus.innerHTML = '<span style="color:var(--accent)">Enter some text first.</span>'; return; }
  const size = parseInt(chunkSize.value, 10);
  broadcastEcc = eccSel.value;
  const interval = Math.round(1000 / parseInt(fps.value, 10));
  broadcastFrames = chunkText(text, size);
  broadcastSession = makeSession();
  broadcastIdx = 0;
  broadcastLoops = 0;
  broadcastPaused = false;
  startSend.disabled = true; pauseSend.disabled = false; stopSend.disabled = false;
  textInput.disabled = true; chunkSize.disabled = true; fps.disabled = true; eccSel.disabled = true;
  pauseSend.textContent = "Pause";
  manualNav.hidden = true;
  jumpFrame.max = broadcastFrames.length;
  tickBroadcast();
  broadcastTimer = setInterval(tickBroadcast, interval);
}

function pauseBroadcast() {
  if (!broadcastFrames.length) return;
  if (!broadcastPaused) {
    if (broadcastTimer) clearInterval(broadcastTimer);
    broadcastTimer = null;
    broadcastPaused = true;
    // The animator increments after rendering, so the just-displayed frame is at idx-1.
    // Step back so manual nav points at the visible frame.
    broadcastIdx = Math.max(0, broadcastIdx - 1);
    pauseSend.textContent = "Resume";
    manualNav.hidden = false;
    showCurrentFrame();
  } else {
    broadcastPaused = false;
    pauseSend.textContent = "Pause";
    manualNav.hidden = true;
    const interval = Math.round(1000 / parseInt(fps.value, 10));
    tickBroadcast();
    broadcastTimer = setInterval(tickBroadcast, interval);
  }
}

function stopBroadcast() {
  if (broadcastTimer) clearInterval(broadcastTimer);
  broadcastTimer = null;
  broadcastPaused = false;
  startSend.disabled = false; pauseSend.disabled = true; stopSend.disabled = true;
  textInput.disabled = false; chunkSize.disabled = false; fps.disabled = false; eccSel.disabled = false;
  pauseSend.textContent = "Pause";
  manualNav.hidden = true;
}

function jumpToFrame(humanIdx) {
  if (!broadcastFrames.length) return;
  const idx = humanIdx - 1; // 1-indexed in UI, 0-indexed internally
  if (isNaN(idx) || idx < 0 || idx >= broadcastFrames.length) {
    sendStatus.innerHTML = `<span style="color:var(--accent)">Frame must be between 1 and ${broadcastFrames.length}.</span>`;
    return;
  }
  if (!broadcastPaused) pauseBroadcast();
  broadcastIdx = idx;
  showCurrentFrame();
}

startSend.onclick = startBroadcast;
pauseSend.onclick = pauseBroadcast;
stopSend.onclick = () => { stopBroadcast(); sendStatus.textContent = "Stopped."; };
prevFrame.onclick = () => { if (broadcastPaused) { broadcastIdx--; showCurrentFrame(); } };
nextFrame.onclick = () => { if (broadcastPaused) { broadcastIdx++; showCurrentFrame(); } };

// Keyboard shortcuts: Space pauses, arrow keys navigate when paused.
document.addEventListener("keydown", (e) => {
  if (sendPanel.hidden) return;
  if (e.target === textInput || e.target === jumpFrame) return;
  if (e.key === " " && !pauseSend.disabled) { e.preventDefault(); pauseBroadcast(); }
  else if (e.key === "ArrowLeft" && broadcastPaused) { e.preventDefault(); prevFrame.click(); }
  else if (e.key === "ArrowRight" && broadcastPaused) { e.preventDefault(); nextFrame.click(); }
  // Bulk mode navigation also responds to arrow keys when bulk frames exist
  else if (e.key === "ArrowLeft" && bulkFrames.length) { e.preventDefault(); bulkStep(-1); }
  else if (e.key === "ArrowRight" && bulkFrames.length) { e.preventDefault(); bulkStep(1); }
});

// ============ QRPAK01 binary file bundle format ============
// [7 bytes magic "QRPAK01"][4 bytes uint32 LE num_files]
// For each file: [2 bytes uint16 LE path_len][path_len bytes UTF-8 path]
//                [4 bytes uint32 LE content_len][content_len bytes raw content]

const PACK_MAGIC = "QRPAK01";

async function buildFilePack() {
  // Read all selected files as ArrayBuffers
  const fileData = await Promise.all(selectedFiles.map(async ({ path, file }) => {
    const ab = await file.arrayBuffer();
    return { path, content: new Uint8Array(ab) };
  }));
  const enc = new TextEncoder();
  let totalSize = PACK_MAGIC.length + 4;
  for (const f of fileData) {
    const pathBytes = enc.encode(f.path);
    totalSize += 2 + pathBytes.length + 4 + f.content.length;
  }
  const buf = new Uint8Array(totalSize);
  const view = new DataView(buf.buffer);
  let offset = 0;
  buf.set(enc.encode(PACK_MAGIC), offset); offset += PACK_MAGIC.length;
  view.setUint32(offset, fileData.length, true); offset += 4;
  for (const f of fileData) {
    const pathBytes = enc.encode(f.path);
    view.setUint16(offset, pathBytes.length, true); offset += 2;
    buf.set(pathBytes, offset); offset += pathBytes.length;
    view.setUint32(offset, f.content.length, true); offset += 4;
    buf.set(f.content, offset); offset += f.content.length;
  }
  return buf;
}

function parseFilePack(bytes) {
  const magic = new TextDecoder().decode(bytes.slice(0, PACK_MAGIC.length));
  if (magic !== PACK_MAGIC) throw new Error("Not a QRPAK01 bundle");
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let offset = PACK_MAGIC.length;
  const numFiles = view.getUint32(offset, true); offset += 4;
  const files = [];
  for (let i = 0; i < numFiles; i++) {
    const pathLen = view.getUint16(offset, true); offset += 2;
    const path = new TextDecoder().decode(bytes.slice(offset, offset + pathLen)); offset += pathLen;
    const contentLen = view.getUint32(offset, true); offset += 4;
    const content = bytes.slice(offset, offset + contentLen); offset += contentLen;
    files.push({ path, content });
  }
  return files;
}

function getMimeType(path) {
  const ext = path.split(".").pop().toLowerCase();
  const map = { txt:"text/plain",md:"text/markdown",html:"text/html",css:"text/css",
    js:"application/javascript",ts:"application/typescript",json:"application/json",
    csv:"text/csv",xml:"application/xml",svg:"image/svg+xml",
    png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",
    pdf:"application/pdf",zip:"application/zip",gz:"application/gzip",
    py:"text/x-python",java:"text/x-java-source",c:"text/x-csrc",cpp:"text/x-c++src",
    sh:"text/x-sh",yaml:"text/yaml",yml:"text/yaml",toml:"text/x-toml",
  };
  return map[ext] || "application/octet-stream";
}

function renderReceivedFiles(files) {

    fileListRecv.appendChild(item);

const downloadZip = document.getElementById("downloadZip");
function patchZipUtf8(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) return bytes;
  const numEntries = view.getUint16(eocd + 8,  true);
  const cdOffset   = view.getUint32(eocd + 16, true);
  let pos = cdOffset;
  for (let e = 0; e < numEntries; e++) {
    if (pos + 46 > bytes.length || view.getUint32(pos, true) !== 0x02014b50) break;
    bytes[pos + 9] |= 0x08;  // CD entry: set bit 11 of general-purpose flags (high byte)
    const localOff = view.getUint32(pos + 42, true);
    if (localOff + 8 < bytes.length && view.getUint32(localOff, true) === 0x04034b50) {
      bytes[localOff + 7] |= 0x08;  // local file header: same bit
    }
    const nameLen    = view.getUint16(pos + 28, true);
    const extraLen   = view.getUint16(pos + 30, true);
    const commentLen = view.getUint16(pos + 32, true);
    pos += 46 + nameLen + extraLen + commentLen;
  }
  return bytes;
}

function bytesToB64(bytes) {
  let s = "";
  const chunkLen = 0x8000; // avoid stack overflow for very large arrays
  for (let i = 0; i < bytes.length; i += chunkLen) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkLen));
  }
  return btoa(s);
}

async function compressDeflate(uint8) {
  if (typeof CompressionStream === "undefined") return null;
  const cs = new CompressionStream("gzip");   // gzip is unambiguous across all browser versions
  const writer = cs.writable.getWriter();
  writer.write(uint8); writer.close();
  const ab = await new Response(cs.readable).arrayBuffer();
  return new Uint8Array(ab);
}

function bulkClear() {
  bulkFrames = []; bulkIdx = 0; bulkSession = "";
  bulkClearBtn.disabled = true;

async function bulkBuild() {
  const src = document.querySelector('input[name="source"]:checked').value;
  const isFiles = src === "files";
  const ecc = bulkEcc.value;
  const targetBytes = parseInt(bulkSize.value, 10);
  const algo = bulkCompress.value;
  let payloadBytes, rawSize;

  if (isFiles) {
    if (!selectedFiles.length) { sendStatus.innerHTML = '<span style="color:var(--accent)">Select files first.</span>'; return; }
    sendStatus.innerHTML = "Reading files…";
    const packed = await buildFilePack();
    rawSize = packed.length;
    payloadBytes = algo === "deflate" ? (await compressDeflate(packed) || packed) : packed;
  } else {
    const text = textInput.value;
    if (!text) { sendStatus.innerHTML = '<span style="color:var(--accent)">Enter some text first.</span>'; return; }
    const rawBytes = new TextEncoder().encode(text);
    rawSize = rawBytes.length;
    payloadBytes = algo === "deflate" ? (await compressDeflate(rawBytes) || rawBytes) : rawBytes;
  }

  const b64 = bytesToB64(payloadBytes);
  const algoChar = algo === "deflate" ? "D" : "N";
  bulkSession = algoChar + Math.random().toString(36).slice(2, 5).padEnd(3, "0").toUpperCase();
  const segLen = Math.max(50, targetBytes - 20);
  const segments = [];
  for (let i = 0; i < b64.length; i += segLen) segments.push(b64.slice(i, i + segLen));
  const total = segments.length;
  bulkFrames = segments.map((seg, i) => `Q3|${bulkSession}|${i + 1}|${total}|${seg}`);
  bulkEccLevel = ecc;
  bulkIdx = 0;
  bulkClearBtn.disabled = false;
  bulkNav.hidden = false;
  bulkJump.max = total;
  const ratio = algo === "deflate" ? `${(payloadBytes.length / rawSize * 100).toFixed(0)}%` : "n/a";
  const tag = isFiles ? `${selectedFiles.length} file${selectedFiles.length!==1?"s":""}` : "text";
  sendStatus.innerHTML = `Built <span class="key">${total}</span> QR frames · ${tag} · ${rawSize}→${payloadBytes.length} B (${ratio}) · session <span class="key">${bulkSession}</span>`;
  bulkShow();
}

function bulkShow() {
  if (!bulkFrames.length) return;
  if (bulkIdx < 0) bulkIdx = bulkFrames.length - 1;
  if (bulkIdx >= bulkFrames.length) bulkIdx = 0;
  const frame = bulkFrames[bulkIdx];
  try {
    renderFrame(frame, bulkEccLevel, /*large=*/true);
    bulkJump.value = bulkIdx + 1;
    const sessionAlgo = bulkSession.startsWith("D") ? "deflate" : "uncompressed";
    sendStatus.innerHTML = `Frame <span class="key">${bulkIdx + 1}/${bulkFrames.length}</span> &middot; session <span class="key">${bulkSession}</span> (${sessionAlgo}) &middot; ${frame.length} chars`;
  } catch (e) {
    sendStatus.innerHTML = `<span style="color:var(--accent)">Render error: ${e.message}. Reduce target size per QR.</span>`;
  }
}

function bulkStep(delta) {
  if (!bulkFrames.length) return;
  bulkIdx += delta;
  bulkShow();
}

function bulkJumpTo(humanIdx) {
  if (!bulkFrames.length) return;
  const idx = humanIdx - 1;
  if (isNaN(idx) || idx < 0 || idx >= bulkFrames.length) {
    sendStatus.innerHTML = `<span style="color:var(--accent)">Frame must be between 1 and ${bulkFrames.length}.</span>`;
    return;
  }
  bulkIdx = idx;
  bulkShow();
}

let scanStream = null;
let scanRAF = null;
let recvSession = null;

let recvTotal = 0;
let recvProtocol = null;  // "Q1", "Q2", or "Q3"

function formatRanges(nums) {
  // Compress sorted integer list into ranges for readability: [1,2,3,7,8,12] -> "1-3, 7-8, 12"
  if (!nums.length) return "";
  const sorted = [...nums].sort((a, b) => a - b);
  const parts = [];
  let s = sorted[0], p = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === p + 1) { p = sorted[i]; continue; }
    parts.push(s === p ? `${s}` : `${s}\u2013${p}`);
    s = p = sorted[i];
  }
  parts.push(s === p ? `${s}` : `${s}\u2013${p}`);
  return parts.join(", ");
}

function renderProgress() {
  const got = Object.keys(recvChunks).length;
  const total = recvTotal;
  progBar.style.width = total ? `${(got / total) * 100}%` : "0%";
  if (total) {
    chunkGrid.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const cell = document.createElement("div");
      cell.className = "chunk-cell" + (recvChunks[i] !== undefined ? " got" : "");
      cell.title = `Frame ${i + 1}${recvChunks[i] !== undefined ? " \u2713" : " (missing)"}`;
      chunkGrid.appendChild(cell);
    }
    const missing = [];
    for (let i = 0; i < total; i++) if (recvChunks[i] === undefined) missing.push(i + 1);
    if (missing.length) {
      missingList.innerHTML = `<span class="key">Still missing (${missing.length}):</span> ${formatRanges(missing)} <span style="color:var(--muted)">&middot; ask sender to Pause and Jump to these frame numbers</span>`;
    } else {
      missingList.innerHTML = "";
    }
  } else {
    missingList.innerHTML = "";
  }
  if (total && got === total) {
    if (recvProtocol === "Q3") {
      // Bulk: needs base64 decode + (maybe) decompression. Show interim status.
      recvStatus.innerHTML = `Reconstructing &amp; decompressing... <span class="key">${got}/${total}</span>`;
      reconstructBulk(total);
    } else {
      let assembled = "";
      for (let i = 0; i < total; i++) assembled += recvChunks[i];
      output.value = assembled;
      recvStatus.innerHTML = `<span class="ok">Complete</span> &middot; ${got}/${total} chunks &middot; session ${recvSession} &middot; ${assembled.length} chars`;
    }
    return true;
  } else if (total) {
    recvStatus.innerHTML = `Receiving... <span class="key">${got}/${total}</span> chunks &middot; session ${recvSession}`;
  }
  return false;
}

function handleScannedText(text) {
  // Q1 (0-indexed, legacy v2), Q2 (1-indexed, animated v3+), Q3 (1-indexed, bulk-compressed v5)
  const m = /^(Q[123])\|([A-Z0-9]{4})\|(\d+)\|(\d+)\|([\s\S]*)$/.exec(text);
  if (!m) return false;
  const [, ver, session, idxS, totalS, payload] = m;
  const total = parseInt(totalS, 10);
  let idx = parseInt(idxS, 10);
  if (ver !== "Q1") idx -= 1; // Q1 is 0-indexed on the wire, Q2/Q3 are 1-indexed
  if (idx < 0 || idx >= total) return false;
  if (recvSession !== session) {
    recvSession = session;
    recvChunks = {};
    recvTotal = total;
    recvProtocol = ver;
  }
  if (recvChunks[idx] === undefined) {
    recvChunks[idx] = payload;
    renderProgress();
    return true;
  }
  return false;
}

async function bytesFromB64(b64) {
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return bytes;
}

async function decompressDeflate(uint8) {
  if (typeof DecompressionStream === "undefined") throw new Error("DecompressionStream not supported");
  // Try gzip first (current format); fall back to zlib-deflate (legacy D sessions)
  for (const fmt of ["gzip", "deflate"]) {
    try {
      const ds = new DecompressionStream(fmt);
      const writer = ds.writable.getWriter();
      const copy = uint8.slice();   // slice because the writer transfer consumes the buffer
      writer.write(copy); writer.close();
      const ab = await new Response(ds.readable).arrayBuffer();
      return new Uint8Array(ab);
    } catch (e) {
      if (fmt === "deflate") throw e;
    }
  }
}

async function reconstructBulk(total) {
  let b64 = "";
  for (let i = 0; i < total; i++) b64 += recvChunks[i];
  try {
    const bytes = await bytesFromB64(b64);
    const algoChar = (recvSession || "")[0];
    let plainBytes;
    if (algoChar === "D") {
      plainBytes = await decompressDeflate(bytes);
    } else if (algoChar === "N") {
      plainBytes = bytes;
    } else {
      throw new Error(`Unknown bulk algorithm prefix: ${algoChar}`);
    }
    // Detect QRPAK01 file bundle vs plain text
    const magic = new TextDecoder("utf-8", { fatal: false }).decode(plainBytes.slice(0, PACK_MAGIC.length));
    if (magic === PACK_MAGIC) {
      const files = parseFilePack(plainBytes);
      window._receivedFiles = files;
      renderReceivedFiles(files);
      recvStatus.innerHTML = `<span class="ok">Complete</span> \u00b7 ${total} chunks \u00b7 ${files.length} file${files.length!==1?"s":""} restored`;
    } else {
      const txt = new TextDecoder().decode(plainBytes);
      output.value = txt;
      output.hidden = false;
      copyOut.parentElement.hidden = false;  // show Copy / Download .txt row
      document.getElementById("fileOutput").hidden = true;
      recvStatus.innerHTML = `<span class="ok">Complete</span> \u00b7 ${total} chunks \u00b7 session ${recvSession} \u00b7 ${txt.length} chars (decompressed from ${bytes.length} B)`;
    }
  } catch (e) {
    recvStatus.innerHTML = `<span style="color:var(--accent)">Reconstruction failed: ${e.message}</span>`;
  }
}

// Decoder detection: prefer the native BarcodeDetector API (same engine MIUI uses
// under the hood) and fall back to jsQR only when unavailable. This is the single
// biggest reliability improvement available -- jsQR runs single-threaded in pure
// JS, while BarcodeDetector runs on the system's hardware-accelerated path.
let nativeDetector = null;
let decoderName = "jsQR (fallback)";

const decoderReady = (async function initDecoder() {
  try {
    if ("BarcodeDetector" in window) {
      const supported = await BarcodeDetector.getSupportedFormats();
      if (supported.includes("qr_code")) {
        nativeDetector = new BarcodeDetector({ formats: ["qr_code"] });
        decoderName = "native BarcodeDetector";
      }
    }
  } catch (e) { /* keep fallback */ }
})();

async function startScanning() {
  await decoderReady;
  try {
    const constraints = {
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: "continuous" }]
      },
      audio: false
    };
    try {
      scanStream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      // Some browsers reject the advanced constraint; retry without it.
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
    }
    video.srcObject = scanStream;
    await video.play();
    startScan.disabled = true; stopScan.disabled = false;
    const track = scanStream.getVideoTracks()[0];
    const settings = track ? track.getSettings() : {};
    recvStatus.innerHTML = `Scanning &middot; decoder: <span class="key">${decoderName}</span> &middot; ${settings.width || "?"}\u00d7${settings.height || "?"}`;
    scanLoop();
  } catch (e) {
    recvStatus.innerHTML = `<span style="color:var(--accent)">Camera error: ${e.message}</span>`;
  }
}

async function scanLoop() {
  if (!scanStream) return;
  try {
    if (nativeDetector) {
      // Native path -- pass the video element directly. No canvas round-trip.
      const codes = await nativeDetector.detect(video);
      for (const c of codes) {
        if (c && c.rawValue) handleScannedText(c.rawValue);
      }
    } else {
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        scanCanvas.width = w; scanCanvas.height = h;
        const ctx = scanCanvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);
        // attemptBoth trades a bit of speed for catching dark-on-light AND light-on-dark
        const code = jsQR(img.data, w, h, { inversionAttempts: "attemptBoth" });
        if (code && code.data) handleScannedText(code.data);
      }
    }
  } catch (e) {
    // Detector errors during a frame should not kill the loop.
  }
  if (scanStream) scanRAF = requestAnimationFrame(scanLoop);
}

function stopScanning() {
  if (scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if (scanStream) {
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
  video.srcObject = null;
  startScan.disabled = false; stopScan.disabled = true;
}

function resetReceive() {
  recvSession = null; recvChunks = {}; recvTotal = 0; recvProtocol = null;
  output.value = ""; output.hidden = false;
  copyOut.parentElement.hidden = false;   // restore Copy / Download .txt row
  progBar.style.width = "0%"; chunkGrid.innerHTML = "";
  missingList.innerHTML = "";
  document.getElementById("fileOutput").hidden = true;
  document.getElementById("fileListRecv").innerHTML = "";
  window._receivedFiles = [];
  recvStatus.textContent = "Reset. Ready for new transmission.";
}

startScan.onclick = startScanning;
stopScan.onclick = stopScanning;
resetScan.onclick = resetReceive;

copyOut.onclick = async () => {
  if (!output.value) return;
  try {
    await navigator.clipboard.writeText(output.value);
    copyOut.textContent = "Copied!";
    setTimeout(() => copyOut.textContent = "Copy to clipboard", 1500);
  } catch (e) {
    output.select(); document.execCommand("copy");
  }
};
downloadOut.onclick = () => {
  if (!output.value) return;
  const blob = new Blob([output.value], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `qr-transfer-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
};

// ============ Manual paste of externally-scanned frames ============
const pasteFrames = document.getElementById("pasteFrames");
const addFrames = document.getElementById("addFrames");
const pasteStatus = document.getElementById("pasteStatus");

addFrames.onclick = () => {
  const raw = pasteFrames.value;
  if (!raw.trim()) { pasteStatus.textContent = "Paste at least one frame first."; return; }
  const frames = [];
  const re = /(Q[123]\|[A-Z0-9]{4}\|\d+\|\d+\|[\s\S]*?)(?=(?:\r?\n)?Q[123]\|[A-Z0-9]{4}\|\d+\|\d+\||$)/g;
  let mm;
  while ((mm = re.exec(raw)) !== null) {
    if (mm[1].trim()) frames.push(mm[1].replace(/\r?\n$/, ""));
  }
  if (!frames.length) {
    pasteStatus.innerHTML = `<span style="color:var(--accent)">No valid frames found. Each frame must start with Q1|, Q2|, or Q3|.</span>`;
    return;
  }
  let added = 0, dup = 0, bad = 0;
  for (const f of frames) {
    const ok = handleScannedText(f);
    if (ok) added++;
    else if (/^Q[123]\|/.test(f)) dup++;
    else bad++;
  }
  pasteStatus.innerHTML = `<span class="ok">Added ${added}</span>` +
    (dup ? ` &middot; ${dup} already had` : "") +
    (bad ? ` &middot; ${bad} unparseable` : "");
  if (added > 0) pasteFrames.value = "";
};
</script>
</body>
